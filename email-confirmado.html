<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101451">
    <meta name="description" content="Conta confirmada no MatQuest.">
    <title>Conta confirmada — MatQuest</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="page-verification">
    <main class="verification-shell">
      <section class="verification-card verification-card--success" aria-labelledby="confirmation-title">
        <a class="verification-brand" href="index.html" aria-label="MatQuest — página inicial">
          <img src="assets/logo.svg" alt="" width="46" height="46">
          <span><b>MAT</b>QUEST</span>
        </a>
        <div class="verification-check" aria-hidden="true">✓</div>
        <img id="confirmation-mascot" class="verification-mascot" src="assets/mascote_feliz.svg" alt="Mascote MatQuest feliz">
        <span class="eyebrow">Tudo pronto</span>
        <h1 id="confirmation-title">Conta confirmada!</h1>
        <p id="confirmation-message">Seu e-mail foi verificado. Agora você já pode iniciar sua jornada pelo reino da matemática.</p>
        <a id="confirmation-action" class="button button-primary" href="entrar.html">Acessar o MatQuest</a>
      </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/email-confirmation.js"></script>
  </body>
</html>
