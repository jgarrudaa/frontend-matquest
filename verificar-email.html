<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101451">
    <meta name="description" content="Confirme seu e-mail para acessar o MatQuest.">
    <title>Verifique seu e-mail — MatQuest</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="page-verification">
    <main class="verification-shell">
      <section class="verification-card" aria-labelledby="verification-title">
        <a class="verification-brand" href="index.html" aria-label="MatQuest — página inicial">
          <img src="assets/logo.svg" alt="" width="46" height="46">
          <span><b>MAT</b>QUEST</span>
        </a>
        <img class="verification-mascot" src="assets/mascote_apontando.svg" alt="Mascote MatQuest apontando">
        <span class="eyebrow">Só falta um passo</span>
        <h1 id="verification-title">Verifique seu e-mail</h1>
        <p>Enviamos um link de confirmação para:</p>
        <strong id="verification-email">seu endereço de e-mail</strong>
        <p class="verification-help">Abra a mensagem do MatQuest e clique em <b>Confirmar minha conta</b>. Confira também a pasta de spam.</p>
        <a class="button button-secondary" href="entrar.html">Voltar para entrar</a>
      </section>
    </main>
    <script>
      const email = new URLSearchParams(location.search).get('email');
      if (email) document.querySelector('#verification-email').textContent = email;
    </script>
  </body>
</html>
